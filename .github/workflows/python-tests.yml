name: Python Unit Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  schedule:
    # Weekly, Monday 07:00 UTC (an hour after the daily smoke test). pip-audit
    # fails on advisories published *after* the pins were last touched, so a
    # push-only trigger lets them pile up silently between commits (Jul→Oct
    # 2026: Werkzeug + urllib3 advisories surfaced only when an unrelated CI
    # fix opened a PR). A scheduled run turns that into a quiet red on a Monday
    # instead of a blocked merge. Scheduled runs only fire from main.
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python Unit Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Match the Dockerfile base image (python:3.12-slim-bookworm)
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run app unit tests
      # Tests import sibling modules (database, canadian_station_sync,
      # tide_adapters) directly, so run from the app/ directory. They are
      # fully offline (CHS/NOAA calls are mocked; DB tests use temp files).
      working-directory: app
      run: python -m unittest discover -p 'test_*.py' -v

    - name: Run usage_events tests
      run: python scripts/test_usage_events.py

    - name: Audit dependencies for known vulnerabilities
      # Fails the build on any known CVE in the pinned set (the urllib3
      # advisories in June 2026 surfaced only via Dependabot after push).
      # Runs AFTER the tests, and always(), so a freshly published advisory
      # never hides the test signal: a red here with green tests above means
      # "bump a pin", not "the app broke".
      if: always()
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt
