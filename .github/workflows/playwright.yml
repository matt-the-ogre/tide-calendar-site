name: Playwright Smoke Tests

on:
  push:
    # This job smoke-tests *production* (tidecalendar.xyz), so it only makes
    # sense on pushes that actually deploy there. A development push doesn't
    # trigger a prod deploy, so it would just re-test the previous deploy.
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '22'

jobs:
  smoke-test:
    name: Production Smoke Test
    timeout-minutes: 10  # up to 5 min of deploy-wait + the tests
    # ubuntu-latest moved to 26.04 on 2026-10-29 and Playwright 1.55 could not
    # install browsers there. Playwright is now kept current (1.64+ supports
    # 26.04); if this step ever fails with "does not support chromium on
    # ubuntuXX.XX", bump @playwright/test first, pin the runner only as a stopgap.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium --with-deps

    - name: Wait for production to serve this commit
      # On a push to main, CapRover is redeploying this very commit, and for
      # a minute or so the old container -- or CapRover's "Powered by CapRover"
      # placeholder, which answers 200 -- still serves the site. A plain
      # "is it up?" check passes during that window and the smoke tests then
      # fail on the placeholder (seen on the #121 merge). So: on push, poll
      # /health until commit_hash equals the SHA that triggered us; on
      # schedule/PR runs (prod is whatever main is), just require a healthy,
      # non-placeholder /health. /health lives on the apex host (www 302s).
      run: |
        set -uo pipefail
        WANT=""
        [ "${GITHUB_EVENT_NAME}" = "push" ] && WANT="${GITHUB_SHA}"
        for i in $(seq 1 30); do
          BODY=$(curl -fsS --connect-timeout 10 --max-time 30 https://tidecalendar.xyz/health || true)
          read -r STATUS GOT < <(printf '%s' "$BODY" | python3 -c '
        import json, sys
        try:
            d = json.load(sys.stdin)
            print(d.get("status", "?"), d.get("commit_hash", "?"))
        except Exception:
            print("unparseable ?")
        ')
          if [ "$STATUS" = "healthy" ] && { [ -z "$WANT" ] || [ "$GOT" = "$WANT" ]; }; then
            echo "Production healthy at commit ${GOT} (wanted ${WANT:-any})"
            exit 0
          fi
          echo "attempt ${i}/30: status=${STATUS} commit=${GOT} (want ${WANT:-any}); retrying in 10s"
          sleep 10
        done
        echo "::error::Production did not report a healthy /health at ${WANT:-any commit} within 5 minutes"
        exit 1

    - name: Run smoke tests
      run: npx playwright test smoke.spec.ts --config=playwright.config.smoke.ts
      env:
        BASE_URL: https://www.tidecalendar.xyz
        CI: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
